# Lefthook Git Hooks Configuration
# https://github.com/evilmartians/lefthook

# Pre-commit hook: Auto-format and fix staged files
pre-commit:
  commands:
    format:
      glob: "**/*.{js,jsx,ts,tsx}"
      run: pnpm biome check --write {staged_files}
      stage_fixed: true

# Commit-msg hook: Validate commit message format
commit-msg:
  commands:
    validate:
      run: bash scripts/validate-conventional-commits.sh edit {1}

# Pre-push hook: Run checks before pushing
pre-push:
  commands:
    conventional-commits:
      run: bash scripts/validate-conventional-commits.sh upstream
      skip:
        - merge
        - rebase
    typecheck:
      run: pnpm typecheck
      skip:
        - merge
        - rebase
