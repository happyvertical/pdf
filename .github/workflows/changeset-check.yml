name: Changeset Check

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

# Pull-request validation: a newer event supersedes the older run. Every
# decision this workflow makes is read from current PR state (title, labels,
# head SHA), so the newest run is always the only one worth finishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read
  contents: read

jobs:
  check:
    name: Check for Changeset
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'arc-happyvertical' }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure npm registry
        run: |
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/npmrc" >> "$GITHUB_ENV"
          printf 'registry=https://registry.npmjs.org/\n' > "$RUNNER_TEMP/npmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Check for changeset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_BRANCH="${{ github.event.pull_request.head.ref }}"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")

          changeset_count=$(find .changeset -name '*.md' ! -name 'README.md' 2>/dev/null | wc -l)
          releaseable_commit_count=$(
            git log "$MERGE_BASE..$HEAD_SHA" --pretty=format:%s --no-merges |
              grep -Ec '^[a-z]+(\([^)]+\))?!:|^(feat|fix|perf)(\([^)]+\))?:|^chore\(deps\):' ||
              true
          )
          release_sensitive_paths=$(
            git diff --name-only "$MERGE_BASE..$HEAD_SHA" -- \
              README.md \
              docs/api \
              pnpm-lock.yaml \
              scripts/check-generated-api-docs.ts \
              src \
              typedoc.json |
              grep -Ev '(^|/)[^/]+\.(test|spec)\.tsx?$' ||
              true
          )
          if ! diff -q \
            <(git show "$MERGE_BASE:package.json" | node -e 'const fs = require("node:fs"); console.log(JSON.stringify(JSON.parse(fs.readFileSync(0, "utf8"))))') \
            <(git show "$HEAD_SHA:package.json" | node -e 'const fs = require("node:fs"); console.log(JSON.stringify(JSON.parse(fs.readFileSync(0, "utf8"))))') \
            >/dev/null; then
            release_sensitive_paths="${release_sensitive_paths}${release_sensitive_paths:+$'\n'}package.json"
          fi

          # Skip if PR has 'skip-changeset' label
          PR_NUM="${{ github.event.pull_request.number }}"
          if gh pr view "$PR_NUM" --json labels \
             --jq '.labels[].name' | grep -q 'skip-changeset'; then
            if [ "$changeset_count" -gt 0 ]; then
              echo "ERROR: PR has the skip-changeset label and a changeset."
              echo "Remove the label or delete the changeset so release intent is unambiguous."
              exit 1
            fi

            if [ "$releaseable_commit_count" -gt 0 ]; then
              echo "ERROR: PR has the skip-changeset label but contains releaseable commits."
              echo "Remove the label, or rewrite the releaseable commits if no release is intended."
              exit 1
            fi

            if [ -n "$release_sensitive_paths" ]; then
              echo "ERROR: PR has the skip-changeset label but changes package or public docs files:"
              printf '%s\n' "$release_sensitive_paths" | sed 's/^/  /'
              echo ""
              echo "Remove the label and use a releaseable PR title or add an explicit changeset."
              exit 1
            fi

            echo "Skipping changeset check (skip-changeset label present)"
            exit 0
          fi

          # Skip if PR is from changeset-release branch (automated version packages PR)
          if echo "$PR_BRANCH" | grep -q '^changeset-release/'; then
            echo "Skipping changeset check (changesets release PR from $PR_BRANCH)"
            exit 0
          fi

          # Skip if PR is from renovate bot (automated dependency update PR)
          if echo "$PR_BRANCH" | grep -q '^renovate/'; then
            echo "Skipping changeset check (Renovate dependency update PR from $PR_BRANCH)"
            exit 0
          fi

          # Skip if PR title starts with 'chore: version packages' or 'chore(release):'
          if echo "$PR_TITLE" | grep -qiE '^chore(\(release\))?:.*version'; then
            echo "Skipping changeset check (version packages PR)"
            exit 0
          fi

          # Squash merges publish from the PR title, so use that as the release source of truth.
          echo ""
          echo "Checking PR title for automatic release eligibility..."

          if printf '%s\n' "$PR_TITLE" | grep -qE '^[a-z]+(\([^)]+\))?!:'; then
            echo "PR title will trigger an automatic minor release on squash merge:"
            echo "  $PR_TITLE"
            exit 0
          fi

          if printf '%s\n' "$PR_TITLE" | grep -qE '^(feat|fix|perf)(\([^)]+\))?:|^chore\(deps\):'; then
            echo "PR title will trigger an automatic patch release on squash merge:"
            echo "  $PR_TITLE"
            exit 0
          fi

          echo "PR title will not trigger an automatic release on squash merge"
          echo ""

          if [ "$changeset_count" -eq 0 ]; then
            echo "No changeset found"
            echo ""
            echo "Please add a changeset by running:"
            echo "  npx changeset"
            echo ""
            echo "Or rename the PR to a releaseable conventional title like:"
            echo "  fix(pdf): ..."
            echo ""
            echo "Or add the 'skip-changeset' label if this PR doesn't require a version bump"
            echo "(e.g., documentation changes, test updates, workflow changes)"
            exit 1
          fi

          echo "Found $changeset_count changeset(s)"
          find .changeset -name '*.md' ! -name 'README.md' -exec basename {} \;

          # Validate no major version bumps
          echo ""
          echo "Validating changeset types..."

          if find .changeset -name '*.md' ! -name 'README.md' \
             -type f -exec grep -l '"major"' {} + 2>/dev/null | grep -q .; then
            echo "ERROR: Major version bump detected in changeset!"
            echo ""
            echo "Files with major bumps:"
            find .changeset -name '*.md' ! -name 'README.md' \
              -type f -exec grep -l '"major"' {} + 2>/dev/null || true
            echo ""
            echo "Major version releases (1.0.0+) must be manually approved and coordinated."
            echo "Please change the version bump type to 'minor' or 'patch'."
            echo ""
            echo "If you truly need a major version bump, coordinate with maintainers first."
            exit 1
          fi

          echo "No major version bumps detected"
