name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Releases are published to, and recorded against, our own registry; npmjs
  # is a best-effort mirror (#137, matching sdk#1266 and smrt#3002). An npmjs
  # outage or token problem must not stop or half-finish a release.
  # A literal, not a repository variable: the publish token is written for and
  # sent to this host, so changing it must be a reviewed workflow change, and
  # scripts/release-registry.mjs refuses any host outside its allowlist.
  RELEASE_PRIMARY_REGISTRY: 'https://npm.happyvertical.com/'

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  release:
    name: Version and Publish
    needs: test
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'arc-happyvertical' }}
    timeout-minutes: 20
    outputs:
      published: ${{ steps.version-check.outputs.changed || 'false' }}
      version: ${{ steps.version-check.outputs.version }}

    steps:
      # The release needs the primary registry's credential, not npmjs's:
      # fail here, in seconds, rather than after the build and validation.
      - name: Verify primary registry publish token
        env:
          PRIMARY_TOKEN: ${{ secrets.NPM_HAPPYVERTICAL_PUBLISH_TOKEN }}
        run: |
          if [ -z "${PRIMARY_TOKEN:-}" ]; then
            echo "::error::NPM_HAPPYVERTICAL_PUBLISH_TOKEN is required to publish to $RELEASE_PRIMARY_REGISTRY"
            exit 1
          fi

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        with:
          app-id: ${{ secrets.HAVE_RELEASE_APP_ID }}
          private-key: ${{ secrets.HAVE_RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure npm registry
        run: |
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/npmrc" >> "$GITHUB_ENV"
          printf 'registry=https://registry.npmjs.org/\n' > "$RUNNER_TEMP/npmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate triggering commit message
        run: |
          bash scripts/validate-conventional-commits.sh last

      - name: Validate version < 1.0.0
        run: |
          version=$(node -p "require('./package.json').version")
          major=$(echo "$version" | cut -d. -f1)
          if [ "$major" -ge 1 ]; then
            echo "ERROR: Version >= 1.0.0 requires manual release"
            exit 1
          fi
          echo "Version is 0.x.x - safe to proceed with automated releases"

      - name: Auto-generate changeset
        run: pnpm run changeset:auto

      - name: Version packages
        run: pnpm run changeset:version

      - name: Regenerate API docs
        run: pnpm docs:api

      - name: Check for version changes
        id: version-check
        run: |
          if git diff --quiet package.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.version-check.outputs.changed == 'true'
        run: pnpm build

      - name: Commit release
        if: steps.version-check.outputs.changed == 'true'
        run: |
          git add .
          git commit -m "chore(release): v${{ steps.version-check.outputs.version }} [skip ci]"

      # Pack once, after the build: the same tarball is published to the
      # primary and mirrored to npmjs, so both registries hold identical bytes.
      - name: Pack release tarball
        if: steps.version-check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-pack"
          pnpm pack --pack-destination "$RUNNER_TEMP/release-pack"
          mapfile -t tarballs < <(find "$RUNNER_TEMP/release-pack" -name '*.tgz')
          [ "${#tarballs[@]}" -eq 1 ]
          echo "TARBALL=${tarballs[0]}" >> "$GITHUB_ENV"

      # Write a fresh npmrc holding only the primary's credential and point
      # npm at it for the rest of the job; never append to setup-node's file
      # (it ends without a newline, so an appended line fuses onto its last
      # line and the token is silently never a credential: smrt#3005).
      # `npm whoami` proves the token against the primary before anything
      # irreversible.
      - name: Authenticate to the primary registry
        if: steps.version-check.outputs.changed == 'true'
        env:
          PRIMARY_TOKEN: ${{ secrets.NPM_HAPPYVERTICAL_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PRIMARY_TOKEN:-}" ]; then
            echo "::error::NPM_HAPPYVERTICAL_PUBLISH_TOKEN is required to publish to $RELEASE_PRIMARY_REGISTRY"
            exit 1
          fi
          # Refuse any host outside the reviewed allowlist BEFORE the token is
          # written for it or sent to it.
          node --input-type=module -e "import { primaryRegistry } from './scripts/release-registry.mjs'; primaryRegistry();"
          host="${RELEASE_PRIMARY_REGISTRY#https://}"
          host="${host%/}"
          rc="$RUNNER_TEMP/release-npmrc"
          umask 077
          printf '//%s/:_authToken=%s\n' "$host" "$PRIMARY_TOKEN" > "$rc"
          echo "NPM_CONFIG_USERCONFIG=$rc" >> "$GITHUB_ENV"
          export NPM_CONFIG_USERCONFIG="$rc"
          who=$(npm whoami --registry "$RELEASE_PRIMARY_REGISTRY" \
            "--@happyvertical:registry=$RELEASE_PRIMARY_REGISTRY")
          echo "Authenticated to $RELEASE_PRIMARY_REGISTRY as $who"

      # Decide what is left to do, so a rerun after a partial failure resumes
      # instead of failing or diverging. Identity is bound to CONTENT, not to
      # the version string: if this version is already on the primary, its
      # integrity must equal the freshly packed tarball's (a resume);
      # otherwise something else was published under this version and we STOP
      # before tagging, releasing or mirroring. The operator bumps the version.
      - name: Resolve release state
        id: state
        if: steps.version-check.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version-check.outputs.version }}
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          args=(--registry "$RELEASE_PRIMARY_REGISTRY" "--@happyvertical:registry=$RELEASE_PRIMARY_REGISTRY")
          local_integrity="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | base64 -w0)"
          if out=$(npm view "$name@$VERSION" dist.integrity "${args[@]}" --prefer-online 2>&1); then
            if [ "$out" != "$local_integrity" ]; then
              echo "::error::$name@$VERSION is already on $RELEASE_PRIMARY_REGISTRY with different contents than this run built. Refusing to tag, release or mirror; bump the version."
              exit 1
            fi
            echo "$name@$VERSION is already on the primary with identical contents; resuming"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$out" | grep -qE 'E404|404 Not Found'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::could not read $name@$VERSION from $RELEASE_PRIMARY_REGISTRY"
            exit 1
          fi
          # An already-pushed tag must point at the commit tree this run would
          # produce; the version commit and tag are pushed atomically, so the
          # tag existing means both landed.
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then
            git fetch --no-tags origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
            if [ "$(git rev-parse "v$VERSION^{tree}")" != "$(git rev-parse 'HEAD^{tree}')" ]; then
              echo "::error::tag v$VERSION exists but its tree differs from the release this run built. Refusing to continue; bump the version."
              exit 1
            fi
            echo "tag v$VERSION already exists with the expected tree; resuming"
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to the primary registry
        if: steps.version-check.outputs.changed == 'true' && steps.state.outputs.publish == 'true'
        run: |
          npm publish "$TARBALL" --registry "$RELEASE_PRIMARY_REGISTRY" \
            "--@happyvertical:registry=$RELEASE_PRIMARY_REGISTRY" --access public

      # Tag and push only after the primary has the version, so a failed
      # publish never leaves a tag or version commit behind. Atomic: the
      # version commit and its tag land together or not at all.
      - name: Push changes and tag
        if: steps.version-check.outputs.changed == 'true' && steps.state.outputs.tagged != 'true'
        run: |
          git tag "v${{ steps.version-check.outputs.version }}"
          git push --atomic origin main "v${{ steps.version-check.outputs.version }}"

      - name: Create GitHub Release
        if: steps.version-check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if gh release view "v${{ steps.version-check.outputs.version }}" >/dev/null 2>&1; then
            echo "Release already exists"
            exit 0
          fi
          gh release create "v${{ steps.version-check.outputs.version }}" \
            --title "v${{ steps.version-check.outputs.version }}" \
            --generate-notes

  # A release is complete once it is on the primary. Mirroring it to npmjs is
  # a separate job that publishes exactly the tarball the PRIMARY serves for
  # this version (downloaded and integrity-checked, never re-packed), so the
  # two registries cannot diverge. It never fails the release
  # (continue-on-error), but it never reports success it did not reach: it
  # re-reads npmjs afterwards and goes red if the version is missing or its
  # bytes differ.
  mirror-npmjs:
    name: Mirror Release to npmjs
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'arc-happyvertical' }}
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Mirror to npmjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          name="@happyvertical/pdf"
          npmjs=https://registry.npmjs.org/
          primary_args=(--registry "$RELEASE_PRIMARY_REGISTRY" "--@happyvertical:registry=$RELEASE_PRIMARY_REGISTRY")
          args=(--registry "$npmjs" "--@happyvertical:registry=$npmjs")
          fail() {
            echo "::error::NOT MIRRORED: $name@$VERSION ($1). The release itself succeeded on $RELEASE_PRIMARY_REGISTRY."
            exit 1
          }
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then fail "NPM_TOKEN is unavailable"; fi
          primary_integrity=$(npm view "$name@$VERSION" dist.integrity "${primary_args[@]}" --prefer-online) \
            || fail "could not read the version from the primary"
          mirror_integrity() { npm view "$name@$VERSION" dist.integrity "${args[@]}" --prefer-online 2>/dev/null || true; }
          have=$(mirror_integrity)
          if [ -n "$have" ]; then
            [ "$have" = "$primary_integrity" ] || fail "npmjs holds different bytes for this version than the primary"
            echo "$name@$VERSION is already on npmjs with identical contents"
            exit 0
          fi
          mkdir -p mirror-pack
          (cd mirror-pack && npm pack "$name@$VERSION" "${primary_args[@]}" > /dev/null)
          tarball=$(find mirror-pack -name '*.tgz')
          [ "$(printf '%s\n' "$tarball" | wc -l)" -eq 1 ] || fail "expected exactly one downloaded tarball"
          actual="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
          [ "$actual" = "$primary_integrity" ] || fail "downloaded tarball does not match the primary's integrity"
          npm publish "$tarball" "${args[@]}" --access public || fail "npm publish failed"
          for attempt in 1 2 3 4 5 6; do
            if [ "$(mirror_integrity)" = "$primary_integrity" ]; then echo "Mirrored $name@$VERSION to npmjs"; exit 0; fi
            sleep $((attempt * 10))
          done
          fail "not visible after publishing"
