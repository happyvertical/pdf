name: Publish Dry Run

# Proves, without publishing, that a release can authenticate to and resolve
# against the primary registry (npm.happyvertical.com) (#137).
#
# SECRET HANDLING: only the `auth` job holds NPM_HAPPYVERTICAL_PUBLISH_TOKEN.
# It does no checkout, installs nothing and runs no repository code: its one
# credentialed step is an inline `npm whoami` against a hard-coded host. Code
# a pull request can change (scripts, package scripts, lifecycle hooks, the
# build) runs only in the `pack` job, which has no secrets at all. Do not
# switch this workflow to `pull_request_target`, and do not add a checkout or
# any repository script to the `auth` job.

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/publish.yml'
      - '.github/workflows/publish-dry-run.yml'
      - 'scripts/release-registry.mjs'
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Holds the token. Trusted inline commands only; no checkout, no install.
  auth:
    name: Primary Registry Auth
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'arc-happyvertical' }}
    timeout-minutes: 5
    steps:
      - name: Authenticate to the primary registry
        env:
          PRIMARY_TOKEN: ${{ secrets.NPM_HAPPYVERTICAL_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PRIMARY_TOKEN:-}" ]; then
            echo "::warning::NPM_HAPPYVERTICAL_PUBLISH_TOKEN is not available to this run (for example a fork); primary registry auth was not checked"
            exit 0
          fi
          registry=https://npm.happyvertical.com/
          rc="$RUNNER_TEMP/release-npmrc"
          umask 077
          printf '//npm.happyvertical.com/:_authToken=%s\n' "$PRIMARY_TOKEN" > "$rc"
          who=$(NPM_CONFIG_USERCONFIG="$rc" npm whoami --registry "$registry" "--@happyvertical:registry=$registry")
          echo "Authenticated to $registry as $who"

  # Runs pull-request code; has no secrets.
  pack:
    name: Pack and Resolve
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'arc-happyvertical' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Install dependencies
        run: pnpm install

      - name: Build and pack
        run: |
          set -euo pipefail
          pnpm build
          mkdir -p "$RUNNER_TEMP/release-pack"
          pnpm pack --pack-destination "$RUNNER_TEMP/release-pack"
          [ "$(find "$RUNNER_TEMP/release-pack" -name '*.tgz' | wc -l)" -eq 1 ]

      - name: Check registry configuration and resolution
        run: |
          set -euo pipefail
          registry=https://npm.happyvertical.com/
          node --input-type=module -e "
            import { primaryRegistry } from './scripts/release-registry.mjs';
            import { readFileSync } from 'node:fs';
            const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
            if (primaryRegistry() !== '$registry') throw new Error('primary registry is not $registry');
            if (pkg.publishConfig?.registry !== '$registry') throw new Error('publishConfig.registry is not $registry');
          "
          npm view @happyvertical/ocr version --registry "$registry" "--@happyvertical:registry=$registry" > /dev/null
          echo "publishConfig and scoped dependency resolution use $registry"
